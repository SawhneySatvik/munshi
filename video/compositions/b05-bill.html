<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <!-- Beat 5 (30-52 s): /bills, the drawn Gupta Traders bill (simulated supplier). Read on the bill, every figure a
         "Read on the bill" chip, butter flagged above the last bill's price, the SIMULATED draft, the tap, the stamp.
         SCREENS: bill-chosen.png, bill-read.png, bill-approved.png (captured after the bill-fix fixture, ab5cb0c). -->
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #b05-kick {
          position: absolute;
          left: 830px;
          top: 128px;
          opacity: 0;
        }
        #b05-head {
          position: absolute;
          left: 830px;
          top: 170px;
          width: 980px;
          opacity: 0;
        }
        #b05-pills {
          position: absolute;
          left: 830px;
          top: 800px;
          display: flex;
          gap: 18px;
        }
        #b05-pills > * {
          opacity: 0;
        }
        #b05-stk {
          position: absolute;
          left: 830px;
          top: 704px;
          opacity: 0;
        }
        #b05-why {
          position: absolute;
          left: 830px;
          top: 700px;
          width: 960px;
          opacity: 0;
        }
        #b05-drawn {
          position: absolute;
          left: 1584px;
          top: 312px;
          opacity: 0;
        }
        #b05-lifts {
          position: absolute;
          inset: 0;
        }
      </style>
      <div id="root" data-composition-id="b05" data-width="1920" data-height="1080">
        <div id="b05-phone" class="phone">
          <div class="phone-body">
            <div class="screen">
              <div id="b05-cam" class="cam">
                <div id="b05-l0" class="layer">
                  <div id="b05-l0-scroll" class="scroll"><img class="shot" src="assets/screens/shelf-approved.png" alt="" /></div>
                  <div class="navbar" style="background-image: url(assets/screens/shelf-chosen.png)"></div>
                </div>
                <div id="b05-l1" class="layer"><img class="shot" src="assets/screens/bill-chosen.png" alt="" /></div>
                <div id="b05-l2" class="layer">
                  <div id="b05-l2-scroll" class="scroll"><img class="shot" src="assets/screens/bill-read.png" alt="" /></div>
                  <div class="navbar" style="background-image: url(assets/screens/bill-chosen.png)"></div>
                </div>
                <div id="b05-l3" class="layer">
                  <div id="b05-l3-scroll" class="scroll">
                    <img class="shot" src="assets/screens/bill-approved.png" alt="" />
                    <div id="b05-l3-marks" class="marks"></div>
                  </div>
                  <div class="navbar" style="background-image: url(assets/screens/bill-chosen.png)"></div>
                </div>
                <div id="b05-marks" class="marks"></div>
              </div>
            </div>
          </div>
        </div>
        <div id="b05-kick" class="kicker">Bills · a simulated supplier</div>
        <h1 id="b05-head" class="head">Read a bill from a photo</h1>
        <div id="b05-pills">
          <span id="b05-p1" class="pill is-meta"><b>Muse Spark</b> reads the lines</span>
          <span id="b05-p2" class="pill is-code"><b>Code</b> matches and flags</span>
        </div>
        <div id="b05-stk" class="sticker is-ink">Simulated supplier · nothing real is sent</div>
        <p id="b05-why" class="note">The flag cites the earlier bills it was checked against.</p>
        <div id="b05-lifts"></div>
        <div id="b05-drawn" class="chip">Drawn bill</div>
      </div>
      <script>
        (function () {
          const B = "b05";
          const tl = K.tl();
          const q = (s) => document.querySelector(s);
          const at = (abs) => K.at(B, abs);
          const counted = SPOTS["shelf-counted"];
          const chosen = SPOTS["bill-chosen"];
          const read = SPOTS["bill-read"];
          const approved = SPOTS["bill-approved"];
          const H = read._page.h;
          const src = "assets/screens/bill-read.png";
          K.phoneSet(tl, q("#b05-phone"));
          K.first(tl, q("#b05-l0"));
          K.scrollSet(tl, q("#b05-l0-scroll"), counted.draft.y - 300);
          // To the bills page; the drawn bill is chosen.
          K.swap(tl, q("#b05-l0"), q("#b05-l1"), 0.35);
          K.words(tl, q("#b05-kick"), 0.5, 0.05);
          K.words(tl, q("#b05-head"), 0.65);
          K.tap(tl, q("#b05-marks"), chosen.read.x + chosen.read.w / 2, chosen.read.y + chosen.read.h / 2, 2.2);
          K.swap(tl, q("#b05-l1"), q("#b05-l2"), 2.45);
          K.pop(tl, q("#b05-p1"), at(33.2));
          // The bill as photographed, with the boxes round what was read.
          let y = 380;
          K.scroll(tl, q("#b05-l2-scroll"), y, 2.9, 0.9);
          const paper = { x: read.boxed.x + 8, y: read.boxed.y + 18, w: read.boxed.w - 16, h: 200 };
          const bill = K.lift(tl, q("#b05-lifts"), { id: "b05-bill", src, h: H, box: paper, scrollY: y, to: { x: 830, y: 300 }, k: 2.35, at: 3.7 });
          K.pop(tl, q("#b05-drawn"), 4.0);
          // Every figure points back to the page: the chips, and the note that the item text is the model's reading.
          K.out(tl, bill, 6.0, 0.25);
          K.out(tl, q("#b05-drawn"), 6.0, 0.2);
          K.scroll(tl, q("#b05-l2-scroll"), (y = read.card.y - 40), 6.0, 0.8);
          const card = { x: read.card.x, y: read.card.y, w: read.card.w, h: read.note.y + read.note.h - read.card.y + 8 };
          K.lift(tl, q("#b05-lifts"), { id: "b05-card", src, h: H, box: card, scrollY: y, to: { x: 830, y: 330 }, k: 2.25, at: 6.6 });
          // Code matches the lines to her catalogue and flags the price that rose.
          K.out(tl, q("#b05-card"), at(38.6), 0.25);
          K.scroll(tl, q("#b05-l2-scroll"), (y = read.butter.y - 120), at(38.6), 0.8);
          K.pop(tl, q("#b05-p2"), at(38.9));
          const butter = { x: 34, y: read.butter.y - 6, w: 322, h: read.butter.h + 12 };
          const line = K.lift(tl, q("#b05-lifts"), { id: "b05-butter", src, h: H, box: butter, scrollY: y, to: { x: 830, y: 400 }, k: 2.45, at: at(39.3) });
          K.underline(tl, line.marks, line.local(read.rise), at(40.6), { width: 7, gap: 14, seed: 4 });
          K.show(tl, q("#b05-why"), at(41.2), 0.35);
          // The draft names the supplier as simulated.
          K.out(tl, line, at(44.0), 0.25);
          K.out(tl, q("#b05-why"), at(44.1), 0.2);
          K.scroll(tl, q("#b05-l2-scroll"), (y = read.draft.y - 40), at(44.0), 0.8);
          const top = { x: read.draft.x, y: read.draft.y - 4, w: read.draft.w + 4, h: 150 };
          K.lift(tl, q("#b05-lifts"), { id: "b05-draft", src, h: H, box: top, scrollY: y, to: { x: 830, y: 330 }, k: 2.3, at: at(44.5) });
          K.slam(tl, q("#b05-stk"), at(45.4), -1.5);
          // One tap, and the bill is in the books, under her name.
          K.out(tl, q("#b05-draft"), at(48.1), 0.25);
          K.out(tl, q("#b05-stk"), at(48.1), 0.2);
          const tapAt = at(48.7);
          K.tap(tl, q("#b05-marks"), read.approve.x + read.approve.w / 2, read.approve.y - y + read.approve.h / 2, tapAt);
          K.scrollSet(tl, q("#b05-l3-scroll"), y);
          K.swap(tl, q("#b05-l2"), q("#b05-l3"), tapAt + 0.1, "cut");
          K.stamp(tl, q("#b05-l3-marks"), "assets/screens/bill-approved.png", approved.stamp, tapAt + 0.12);
          const done = { x: approved.done.x - 8, y: approved.done.y - 10, w: approved.done.w + 16, h: approved.done.h + 16 };
          K.lift(tl, q("#b05-lifts"), { id: "b05-done", src: "assets/screens/bill-approved.png", h: approved._page.h, box: done, scrollY: y, to: { x: 830, y: 330 }, k: 2.1, at: tapAt + 0.7 });
          ["#b05-kick", "#b05-head", "#b05-p1", "#b05-p2", "#b05-done"].forEach((s) => K.out(tl, q(s), 21.55, 0.25));
          K.reg(B, tl, CLOCK.beat(B).dur);
        })();
      </script>
    </template>
  </body>
</html>
