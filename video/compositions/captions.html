        <p id="cap-1-1" class="clip cap" data-start="0.35" data-duration="2.89" data-track-index="0">The books say one thing. The shelf says another.</p>
        <p id="cap-2-1" class="clip cap" data-start="4.40" data-duration="2.04" data-track-index="0">A photo of the shelf.</p>
        <p id="cap-2-2" class="clip cap" data-start="6.60" data-duration="4.53" data-track-index="0">Spark names the products. SAM finds every pack. Code compares.</p>
        <p id="cap-3-1" class="clip cap" data-start="13.40" data-duration="2.87" data-track-index="0">Every number opens to the row it came from.</p>
        <p id="cap-3-2" class="clip cap" data-start="17.20" data-duration="2.93" data-track-index="0">Spark drafts the fix. It cannot write it.</p>
        <p id="cap-4-1" class="clip cap" data-start="21.30" data-duration="4.13" data-track-index="0">She asks out loud what is waiting, and Munshi finds the draft.</p>
        <p id="cap-4-2" class="clip cap" data-start="25.60" data-duration="2.95" data-track-index="0">She taps Approve. Her name goes on the books.</p>
        <p id="cap-5-1" class="clip cap" data-start="30.50" data-duration="1.97" data-track-index="0">Then the supplier's bill.</p>
        <p id="cap-5-2" class="clip cap" data-start="33.20" data-duration="3.98" data-track-index="0">Spark copies the lines, and every figure points back to the page.</p>
        <p id="cap-5-3" class="clip cap" data-start="38.80" data-duration="4.04" data-track-index="0">Code matches them to her catalogue and flags a price that rose.</p>
        <p id="cap-5-4" class="clip cap" data-start="44.20" data-duration="3.57" data-track-index="0">This supplier is simulated. Nothing real is sent.</p>
        <p id="cap-5-5" class="clip cap" data-start="48.30" data-duration="2.46" data-track-index="0">One tap, and the bill is in the books.</p>
        <p id="cap-6-1" class="clip cap" data-start="52.50" data-duration="2.31" data-track-index="0">She asks out loud, in Hindi.</p>
        <p id="cap-6-2" class="clip cap" data-start="56.20" data-duration="4.02" data-track-index="0">Every number in the answer is a chip. Tap one, and see its row.</p>
        <p id="cap-6-3" class="clip cap" data-start="62.60" data-duration="3.15" data-track-index="0">The model never types a number. The server does.</p>
        <p id="cap-6-4" class="clip cap" data-start="67.60" data-duration="3.12" data-track-index="0">Ask who owes the most, and the same rule holds.</p>
        <p id="cap-7-1" class="clip cap" data-start="75.00" data-duration="2.70" data-track-index="0">Now ask something the books cannot answer.</p>
        <p id="cap-7-2" class="clip cap" data-start="79.60" data-duration="5.21" data-track-index="0">When a number cannot trace to a row, Munshi does not guess. It says: cannot verify.</p>
        <p id="cap-7-3" class="clip cap" data-start="85.60" data-duration="4.38" data-track-index="0">And on every screen, a figure with no row behind it is never shown.</p>
        <p id="cap-8-1" class="clip cap" data-start="90.50" data-duration="2.36" data-track-index="0">Four Meta models, four jobs.</p>
        <p id="cap-8-2" class="clip cap" data-start="93.40" data-duration="3.25" data-track-index="0">Muse Spark routes, reasons and reads the photos.</p>
        <p id="cap-8-3" class="clip cap" data-start="97.60" data-duration="3.66" data-track-index="0">SAM counts the packs. Voice Transcribe hears Hindi.</p>
        <p id="cap-8-4" class="clip cap" data-start="102.40" data-duration="3.23" data-track-index="0">Spark Open, on Baseten, writes the short answer.</p>
        <p id="cap-8-5" class="clip cap" data-start="107.40" data-duration="2.19" data-track-index="0">And code does every sum.</p>
        <p id="cap-9-1" class="clip cap" data-start="112.50" data-duration="1.80" data-track-index="0">Here is the rule.</p>
        <p id="cap-9-2" class="clip cap" data-start="115.00" data-duration="6.13" data-track-index="0">Nothing changes the books without a named person's approval. And every number traces to a ledger row.</p>
        <p id="cap-9-3" class="clip cap" data-start="124.60" data-duration="2.53" data-track-index="0">The agent has no write access.</p>
        <p id="cap-9-4" class="clip cap" data-start="128.60" data-duration="2.85" data-track-index="0">The database enforces it, not the prompt.</p>
        <p id="cap-10-1" class="clip cap" data-start="136.50" data-duration="2.10" data-track-index="0">What is not proven yet.</p>
        <p id="cap-10-2" class="clip cap" data-start="139.40" data-duration="3.91" data-track-index="0">No live Meta model has run, so these answers are recorded.</p>
        <p id="cap-10-3" class="clip cap" data-start="145.00" data-duration="3.36" data-track-index="0">Real photos and Hindi speech are still to be measured.</p>
        <p id="cap-10-4" class="clip cap" data-start="150.40" data-duration="2.72" data-track-index="0">The checker would sooner refuse than guess.</p>
        <p id="cap-10-5" class="clip cap" data-start="154.80" data-duration="5.39" data-track-index="0">The data is synthetic, the suppliers are simulated, and money is only ever recorded.</p>
        <p id="cap-11-1" class="clip cap" data-start="162.80" data-duration="4.00" data-track-index="0">Munshi. A back office that shows its work, and waits for a person.</p>
        <p id="cap-11-2" class="clip cap" data-start="168.60" data-duration="2.23" data-track-index="0">Code and demo, linked below.</p>
