<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <!-- Beat 7 (74-90 s): a question the books cannot answer ("What is the weather in Delhi today?") gets CANNOT VERIFY,
         never a guess. Today's screen is the no-recording fallback, and the film says so; the checker refusing a live
         model's answer is the re-shoot. SCREENS: ask-credit.png, ask-cannot.png. -->
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #b07-head {
          position: absolute;
          left: 830px;
          top: 150px;
          width: 980px;
          opacity: 0;
        }
        #b07-note {
          position: absolute;
          left: 830px;
          top: 814px;
          width: 960px;
          font-size: 30px;
          opacity: 0;
        }
        #b07-stk {
          position: absolute;
          left: 830px;
          top: 400px;
          opacity: 0;
        }
        #b07-lifts {
          position: absolute;
          inset: 0;
        }
      </style>
      <div id="root" data-composition-id="b07" data-width="1920" data-height="1080">
        <div id="b07-phone" class="phone">
          <div class="phone-body">
            <div class="screen">
              <div id="b07-cam" class="cam">
                <div id="b07-l0" class="layer"><img class="shot" src="assets/screens/ask-credit.png" alt="" /></div>
                <div id="b07-l1" class="layer">
                  <img class="shot" src="assets/screens/ask-cannot.png" alt="" />
                  <div id="b07-l1-marks" class="marks"></div>
                </div>
                <div id="b07-marks" class="marks"></div>
              </div>
            </div>
          </div>
        </div>
        <h1 id="b07-head" class="head">A question the books cannot answer</h1>
        <p id="b07-note" class="note" data-hold>Shown: the no-recording fallback. A live refusal is still to be shot.</p>
        <div id="b07-stk" class="sticker is-ink">No row, no figure</div>
        <div id="b07-lifts"></div>
      </div>
      <script>
        (function () {
          const B = "b07";
          const tl = K.tl();
          const q = (s) => document.querySelector(s);
          const at = (abs) => K.at(B, abs);
          const cannot = SPOTS["ask-cannot"];
          K.phoneSet(tl, q("#b07-phone"));
          K.first(tl, q("#b07-l0"));
          K.cover(tl, q("#b07-l1-marks"), { x: cannot.reply.x, y: cannot.reply.y, w: cannot.reply.w, h: cannot.reply.h }, at(79.4), { dur: 0.4 });
          K.swap(tl, q("#b07-l0"), q("#b07-l1"), 0.6);
          K.words(tl, q("#b07-head"), at(75.0));
          K.lift(tl, q("#b07-lifts"), { id: "b07-said", src: "assets/screens/ask-cannot.png", box: cannot.said, to: { x: 830, y: 360 }, k: 2.3, at: 2.0 });
          // When a number cannot trace to a row: cannot verify.
          const cv = K.lift(tl, q("#b07-lifts"), { id: "b07-cv", src: "assets/screens/ask-cannot.png", box: cannot.cv, to: { x: 830, y: 556 }, k: 2.4, at: at(79.9) });
          cv.setAttribute("data-hold", ""); // held while line 7.2 is read; the ink circle draws on it
          K.circle(tl, cv.marks, { x: 0, y: 0, w: cannot.cv.w * 2.4, h: cannot.cv.h * 2.4 }, at(81.9), { pad: 18, width: 7, seed: 13, dur: 0.7 });
          K.show(tl, q("#b07-note"), at(83.4), 0.4);
          K.out(tl, q("#b07-said"), at(85.5), 0.2);
          K.slam(tl, q("#b07-stk"), at(85.8), -2);
          ["#b07-head", "#b07-said", "#b07-cv", "#b07-note", "#b07-stk"].forEach((s) => K.out(tl, q(s), 15.35, 0.25));
          K.phoneOut(tl, q("#b07-phone"), 15.4, { x: -80, y: 120 });
          K.reg(B, tl, CLOCK.beat(B).dur);
        })();
      </script>
    </template>
  </body>
</html>
