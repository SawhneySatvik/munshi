<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <!-- Beat 8 (90-112 s): four Meta models, four jobs, ruled into the ledger one row at a time as the narration names
         them; code does every sum. "Built with Muse Spark Open" (its licence asks for it). Model names are the README's;
         their ids are unconfirmed against a live call. -->
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #b08-kick {
          position: absolute;
          left: 200px;
          top: 112px;
          opacity: 0;
        }
        #b08-head {
          position: absolute;
          left: 200px;
          top: 150px;
          width: 1500px;
          opacity: 0;
        }
        .b08-row {
          position: absolute;
          left: 200px;
          width: 1610px;
          height: 112px;
          border-top: 4px solid var(--ink);
          display: flex;
          align-items: center;
          opacity: 0;
        }
        .b08-row .name {
          width: 640px;
          font-family: var(--f-display);
          font-weight: 800;
          font-size: 50px;
          letter-spacing: -0.01em;
          line-height: 1;
        }
        .b08-row .name small {
          display: block;
          margin-top: 8px;
          font-family: var(--f-mono);
          font-weight: 600;
          font-size: 28px;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: var(--muted);
        }
        .b08-row .job {
          width: 970px;
          font-family: var(--f-body);
          font-weight: 700;
          font-size: 36px;
          line-height: 1.25;
        }
        #b08-r5 .name span {
          display: inline-block;
          background: var(--ink);
          color: var(--paper-2);
          padding: 6px 18px 10px;
          border-radius: 10px;
        }
        #b08-r1 {
          top: 280px;
        }
        #b08-r2 {
          top: 396px;
        }
        #b08-r3 {
          top: 512px;
        }
        #b08-r4 {
          top: 628px;
        }
        #b08-r5 {
          top: 744px;
        }
        #b08-built {
          position: absolute;
          left: 200px;
          top: 892px;
          opacity: 0;
        }
      </style>
      <div id="root" data-composition-id="b08" data-width="1920" data-height="1080">
        <div id="b08-kick" class="kicker">Where Meta's models work</div>
        <h1 id="b08-head" class="head">Four Meta models, four jobs</h1>
        <div id="b08-r1" class="b08-row"><div class="name">Muse Spark</div><div class="job">Routes each question, reasons over the books, reads shelf and bill photos.</div></div>
        <div id="b08-r2" class="b08-row"><div class="name">SAM 3.1</div><div class="job">Finds every pack on the shelf photo, one product per request.</div></div>
        <div id="b08-r3" class="b08-row"><div class="name">Muse Voice Transcribe</div><div class="job">Turns Hindi and English speech into text.</div></div>
        <div id="b08-r4" class="b08-row"><div class="name">Muse Spark Open<small>on Baseten · open weights</small></div><div class="job">Writes the short answer; every figure in it is a cited cell.</div></div>
        <div id="b08-r5" class="b08-row"><div class="name"><span>Code</span></div><div class="job">Does every sum. No model does arithmetic.</div></div>
        <div id="b08-built" class="sticker">Built with Muse Spark Open</div>
      </div>
      <script>
        (function () {
          const B = "b08";
          const tl = K.tl();
          const q = (s) => document.querySelector(s);
          const at = (abs) => K.at(B, abs);
          K.words(tl, q("#b08-kick"), 0.3, 0.05);
          K.words(tl, q("#b08-head"), at(90.5));
          // Each row is ruled in (its top line drawn), then its words land.
          const row = (sel, t) => {
            const r = q(sel);
            tl.fromTo(r, { opacity: 1, borderTopColor: "rgba(27,22,17,0)" }, { borderTopColor: "rgba(27,22,17,1)", duration: 0.3, ease: "power2.out", immediateRender: false }, t);
            tl.set(r, { opacity: 1 }, t);
            K.words(tl, r.querySelector(".name"), t + 0.1, 0.06);
            K.words(tl, r.querySelector(".job"), t + 0.35, 0.035);
          };
          row("#b08-r1", at(93.4));
          row("#b08-r2", at(97.6));
          row("#b08-r3", at(99.4));
          row("#b08-r4", at(102.4));
          row("#b08-r5", at(107.4));
          K.slam(tl, q("#b08-built"), at(109.4), -1.5);
          ["#b08-kick", "#b08-head", "#b08-r1", "#b08-r2", "#b08-r3", "#b08-r4", "#b08-r5", "#b08-built"].forEach((s, i) => K.out(tl, q(s), 21.45 + i * 0.03, 0.25));
          K.reg(B, tl, CLOCK.beat(B).dur);
        })();
      </script>
    </template>
  </body>
</html>
