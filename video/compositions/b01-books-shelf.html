<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <!-- Beat 1 (0-4 s): the books' row for Glucose biscuits (captured from /stock) beside the drawn shelf photo; they
         disagree. The shelf then carries off towards the phone of beat 2. -->
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #b01-books-lab {
          position: absolute;
          left: 196px;
          top: 360px;
          opacity: 0;
        }
        #b01-shelf-lab {
          position: absolute;
          left: 1110px;
          top: 214px;
          opacity: 0;
        }
        #b01-shelf {
          position: absolute;
          left: 1090px;
          top: 300px;
          width: 720px;
          height: 512px;
          opacity: 0;
          border: 4px solid var(--ink);
          border-radius: 16px;
          box-shadow: 10px 10px 0 var(--ink);
          overflow: hidden;
          background: var(--paper-2);
        }
        #b01-shelf img {
          display: block;
          width: 100%;
          height: 100%;
        }
        #b01-neq {
          position: absolute;
          left: 978px;
          top: 506px;
          overflow: visible;
        }
        #b01-neq path {
          opacity: 0;
          fill: none;
          stroke: var(--red);
          stroke-width: 12;
          stroke-linecap: round;
        }
        #b01-lifts {
          position: absolute;
          inset: 0;
        }
      </style>
      <div id="root" data-composition-id="b01" data-width="1920" data-height="1080">
        <div id="b01-lifts"></div>
        <div id="b01-books-lab" class="sticker is-ink">The books</div>
        <div id="b01-shelf"><img src="assets/art/shelf.png" alt="" /></div>
        <div id="b01-shelf-lab" class="sticker">The shelf · drawn</div>
        <svg id="b01-neq" width="110" height="110"><path id="b01-neq-a" d="M14 40 H96" /><path id="b01-neq-b" d="M14 72 H96" /><path id="b01-neq-c" d="M78 12 L32 100" /></svg>
      </div>
      <script>
        (function () {
          const B = "b01";
          const tl = K.tl();
          const at = (abs) => K.at(B, abs);
          const sp = SPOTS["stock-glucose"];
          // The books: the Glucose biscuits row of /stock, lifted at 2x.
          const books = K.lift(tl, document.querySelector("#b01-lifts"), {
            id: "b01-books",
            src: "assets/screens/stock-glucose.png",
            box: { x: sp.row.x, y: sp.row.y, w: sp.row.w, h: sp.row.h },
            to: { x: 150, y: 440 },
            k: 2.25,
            at: 0,
            fly: false,
          });
          tl.fromTo(books, { opacity: 0, y: 40, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0.15);
          K.slam(tl, document.querySelector("#b01-books-lab"), 0.45, -2);
          // The circled figure: where the books' 45 sits on that row.
          // The books' figure (its box read off this capture: the stock row has no spot of its own).
          K.circle(tl, books.marks, books.local({ x: 146, y: 566, w: 20, h: 22 }), 1.0, { pad: 14, width: 6, seed: 3 });
          // The shelf: the drawn synthetic shelf photo.
          tl.fromTo("#b01-shelf", { opacity: 0, y: 40, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, at(1.75));
          K.slam(tl, document.querySelector("#b01-shelf-lab"), at(2.0), 2);
          // A red not-equal, drawn stroke by stroke.
          ["#b01-neq-a", "#b01-neq-b", "#b01-neq-c"].forEach((sel, i) => {
            const p = document.querySelector(sel);
            const len = p.getTotalLength();
            tl.fromTo(p, { opacity: 1, strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.18, ease: "power2.out", immediateRender: false }, 2.55 + i * 0.16);
          });
          // Out: the books and the sign leave; the shelf heads left, towards the phone that opens beat 2.
          K.out(tl, books, 3.55, 0.3);
          K.out(tl, "#b01-books-lab", 3.5, 0.25);
          K.out(tl, "#b01-shelf-lab", 3.5, 0.25);
          K.out(tl, "#b01-neq", 3.45, 0.25);
          tl.to("#b01-shelf", { x: -760, y: -20, scale: 0.5, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power3.in" }, 3.55);
          K.reg(B, tl, CLOCK.beat(B).dur);
        })();
      </script>
    </template>
  </body>
</html>
