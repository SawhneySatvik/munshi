name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # packageManager in package.json pins pnpm; corepack installs exactly that.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # lint + typecheck + tests. Tests run on embedded Postgres and recorded model fixtures: no secrets, no network models.
      - run: pnpm check
        env:
          MUNSHI_MODEL_MODE: recorded
